name: Debug Build

on:
  push:
    branches:
      - main
      - v2-rebuild
      - 'feature/**'
  workflow_dispatch:

jobs:
  Android-Debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      # 缓存 gradle 编译依赖(加速构建),但只缓存 ~/.gradle/caches,
      # 不缓存 app/build 产物(bundle 每次用最新源码重新打包,避免旧代码)
      - name: Cache Gradle deps
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          # 彻底清理 Metro 缓存 + gradle bundle 产物,强制用最新源码重新打包 JS
          rm -rf app/build/generated/assets \
                 app/build/generated/react \
                 ../node_modules/.cache \
                 ~/.metro \
                 /tmp/metro-* \
                 app/build/intermediates/merged_assets \
                 app/build/intermediates/assets \
                 app/build/ASSETS \
                 app/build/generated/autolinking \
                 app/build/generated/res/react
          ./gradlew assembleDebug --no-configuration-cache --console=plain -PreactNativeArchitectures=arm64-v8a
          echo "=== bundle 产物检查 ==="
          find app/build -name "index.android.bundle" -exec ls -la {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          # 只上传 arm64-v8a 单架构(手机用的),避免 universal 全架构包导致 208MB/101MB
          path: android/app/build/outputs/apk/debug/*arm64-v8a.apk
          if-no-files-found: error
