name: Debug Build

on:
  push:
    branches:
      - main

jobs:
  Android-Debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          # 禁用 gradle 构建缓存(--no-build-cache)+ 清掉旧 JS bundle,
          # 强制 Metro 用最新源码重新打包(避免 CI 缓存导致 bundle 陈旧)
          rm -rf app/build/generated/assets \
                 app/build/generated/react \
                 ../node_modules/.cache
          ./gradlew assembleDebug --no-build-cache --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
