name: Debug Build

on:
  push:
    branches:
      - main

jobs:
  Android-Debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          # 彻底清理 Metro 缓存 + gradle bundle 产物,强制用最新源码重新打包 JS
          rm -rf app/build/generated/assets \
                 app/build/generated/react \
                 ../node_modules/.cache \
                 ~/.metro \
                 /tmp/metro-* \
                 app/build/intermediates/merged_assets \
                 app/build/intermediates/assets
          ./gradlew assembleDebug --no-build-cache --no-configuration-cache --rerun-tasks --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
